<daff-viewport>
  <daff-sidebar
    class="over-sidebar"
    mode="over"
    [side]="sideControl.value.value">
    <daff-sidebar-header [dismissible]="true">
      <div daffSidebarHeaderTitle>Title</div>
    </daff-sidebar-header>
    <div class="over-and-under-sidebars__sidebar-content">
      Sidebar content
    </div>
    <daff-sidebar-footer>
      <div class="over-and-under-sidebars__footer">
        Sidebar footer
      </div>
    </daff-sidebar-footer>
  </daff-sidebar>
  <div class="over-and-under-sidebars__body-content">
    <div class="over-and-under-sidebars__options-container">
      <daff-form-field>
        <daff-form-label>Side</daff-form-label>
        <daff-select [options]="sides" [formControl]="sideControl">
          <ng-template daffSelectOption let-option="option">
            {{ option.label }}
          </ng-template>
        </daff-select>
      </daff-form-field>
    </div>

    <button daff-button (click)="openSidebar()">
      Open
    </button>
  </div>
</daff-viewport>
