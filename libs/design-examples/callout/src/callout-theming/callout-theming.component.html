<daff-form-field>
  <daff-form-label>Color</daff-form-label>
  <daff-select [options]="options" [formControl]="colorControl">
    <ng-template daffSelectOption let-option="option">
      {{ option.label }}
    </ng-template>
  </daff-select>
</daff-form-field>

<daff-callout [color]="$safeNavigationMigration(colorControl.value?.value)">
  <div class="daff-callout-theming__icon" daffCalloutIcon>
    <fa-icon [icon]="faTag"></fa-icon>
  </div>
  <div daffCalloutTagline>Limited time offer</div>
  <h3 daffCalloutTitle>Summer Sale — Up to 30% off sitewide.</h3>
  <div daffCalloutSubtitle>
    <p>
      Shop our biggest sale of the season with up to 30% off on select styles,
      accessories, and more.
    </p>
    <p>Use code SUMMER30 at checkout. Offer ends July 31.</p>
  </div>
  <div daffCalloutBody>
    <a daff-button color="theme-contrast" routerLink="/sale">Shop the sale</a>
  </div>
</daff-callout>
