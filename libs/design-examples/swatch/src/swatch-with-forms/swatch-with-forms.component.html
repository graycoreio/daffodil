<span id="swatch-with-forms-label">Choose a color</span>
<daff-swatch-group
  aria-labelledby="swatch-with-forms-label"
  aria-describedby="swatch-with-forms-error"
  [formControl]="colorControl"
>
  @for (color of colors; track color.value) {
    <daff-swatch [value]="color.value" [color]="color.color" [attr.aria-label]="color.label"></daff-swatch>
  }
</daff-swatch-group>

@if (colorControl.touched && colorControl.invalid) {
  <daff-error-message id="swatch-with-forms-error">Please choose a color.</daff-error-message>
}
<p>Value: {{ colorControl.value }}</p>
