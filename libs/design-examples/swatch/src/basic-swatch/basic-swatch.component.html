<span id="basic-swatch-label">Color: {{ selectedLabel() }}</span>
<daff-swatch-group aria-labelledby="basic-swatch-label" [(value)]="selected">
  @for (color of colors; track color.value) {
    <daff-swatch [value]="color.value" [color]="color.color" [attr.aria-label]="color.label"></daff-swatch>
  }
</daff-swatch-group>
