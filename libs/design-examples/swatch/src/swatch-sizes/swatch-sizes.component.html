<daff-swatch-group size="sm" aria-label="Small swatches" value="red">
  @for (color of colors; track color.value) {
    <daff-swatch [value]="color.value" [color]="color.color" [attr.aria-label]="color.label"></daff-swatch>
  }
</daff-swatch-group>
