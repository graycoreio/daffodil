<daff-form-field>
  <label daffFormLabel for="error-textarea">Comments</label>
  <textarea daff-textarea type="text" placeholder="Comments" name="comments" [formControl]="control" id="error-textarea"></textarea>
  @if (control.errors?.required) {
    <daff-error-message>Comments is a required field.</daff-error-message>
  }
</daff-form-field>
