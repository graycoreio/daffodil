<select daff-native-select
  [formControl]="ngControl.control"
  (focus)="onFocus()"
>
  @for (let item of valueArray) {
    <option [value]="item">{{ item }}</option>
  }
  @if (extendable) {
    <option [value]="max">{{ max }}+</option>
  } @else {
    <option [value]="max">{{ max }}</option>
  }
</select>
