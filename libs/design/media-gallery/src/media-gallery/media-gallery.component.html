<div class="daff-media-gallery__thumbnails">
	@for (thumbnail of _thumbnails; track thumbnail; let index = $index) {
		<button class="daff-thumbnail" [class.daff-selected]="thumbnail.selected" 
		attr.aria-label="Select {{ thumbnail.label }}"
		(click)="selectThumbnail(thumbnail)" >
			@if(thumbnail.thumbnail) {
				<img [src]="thumbnail.thumbnail" aria-hidden="true"/>
			}
		</button>
	}
</div>
<div class="daff-media-gallery__selected-thumbnail">
	@if(_selectedThumbnail) {
		<ng-container *ngTemplateOutlet="_selectedThumbnail.templateRef"></ng-container>
	}
</div>
