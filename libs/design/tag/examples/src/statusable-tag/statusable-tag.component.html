<daff-tag *ngIf="!hiddenTags['warn']" status="warn" dismissible (closeTag)="hideTag('warn')">
  <fa-icon daffPrefix [icon]="faCircleCheck"></fa-icon>
  <div>Warn</div>
</daff-tag>

  <div>Success</div>
</daff-tag>
