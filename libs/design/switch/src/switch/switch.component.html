<label class="daff-switch__label" [id]="labelId" [for]="id()">
  <ng-content></ng-content>
</label>

<button class="daff-switch__toggle"
  type="button"
  role="switch"
  (click)="onToggle()"
  [attr.disabled]="disabled ? '' : null"
  [attr.aria-checked]="checked() ? true : false"
  [attr.aria-labelledby]="labelId"
  [attr.id]="id()">
</button>
