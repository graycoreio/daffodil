<label class="daff-switch" 
  [class.disabled]="disabled"
  [class.left]="labelPosition === 'left'"
  [class.right]="labelPosition === 'right'"
  [class.top]="labelPosition === 'top'"
  [class.bottom]="labelPosition === 'bottom'"
  [attr.for]="id">
  <div class="daff-switch__text">
    <ng-content></ng-content>
  </div>
  <div class="daff-switch__toggle" [class.checked]="checked">
    <div class="daff-switch__activator">
      @if (loading) {
        <daff-loading-icon></daff-loading-icon>
      }
    </div>
    <input 
      type="checkbox" 
      role="switch" 
      class="cdk-visually-hidden"
      [attr.disabled] = "disabled ? '' : null" 
      [checked]="checked"
      (change)="onToggle()"
      [attr.aria-label]="ariaLabel"
      [attr.aria-checked]="checked ? true : false"
      [attr.id]="id"
    />    
  </div>
</label>
<ng-content select="daff-error-message"></ng-content>
