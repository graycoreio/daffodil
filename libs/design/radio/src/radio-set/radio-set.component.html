<div class="daff-radio-set__label" [id]="id()">
	<ng-content select="daff-form-label"></ng-content>
</div>
<div class="daff-radio-set__wrapper" role="radiogroup" [attr.aria-labelledby]="id()">
	<ng-content select="daff-radio"></ng-content>
</div>
@if (hasHint() || hasErrorMessage()) {
	<div class="daff-radio-set__hint-and-error">
		@if (hasHint()) {
			<div class="daff-radio-set__hint-wrapper"
				[id]="hintId">
				<ng-content select="daff-hint"></ng-content>
			</div>
		}
		@if (hasErrorMessage()) {
			<div class="daff-radio-set__error-wrapper"
				[id]="errorMessageId">
				<ng-content select="daff-error-message"></ng-content>
			</div>
		}
	</div>
}
