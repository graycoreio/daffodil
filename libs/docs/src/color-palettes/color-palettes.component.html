@for (palette of palettes(); track palette.internal_name) {
	<div class="daff-docs-color-palette daff-docs-color-palette__brand-{{palette.internal_name}}">
		<div class="daff-docs-color-palette__name">{{ palette.friendly_name }}</div>
		@for (shade of palette.shades; track shade.step) {
			<daff-docs-color-strip [background]="shade.hex">
				<div daffDocsColorStripStep>{{shade.step}}</div>
				<div daffDocsColorStripHex>{{shade.hex}}</div>
			</daff-docs-color-strip>
		}
	</div>
}
