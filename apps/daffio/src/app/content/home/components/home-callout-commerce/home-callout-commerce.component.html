<daff-callout color="theme">
  <daff-container size="md">
    <div class="daffio-home-callout-commerce__grid">
      <div class="daffio-home-callout-commerce__content">
        <div daffCalloutTagline>
          Get started in seconds
        </div>
        <h3 daffCalloutTitle>
          Build only what you need.
        </h3>
        <p daffCalloutSubtitle>
          Choose your backend, pick your features, and start selling.
        </p>
        <div daffCalloutBody>
          <button class="daffio-home-callout-commerce__code-copy"
            [cdkCopyToClipboard]="command"
            (cdkCopyToClipboardCopied)="onCopySuccess($event)">
            <code>npx ng add &#64;daffodil/commerce</code>
            <fa-icon [icon]="icon"></fa-icon>
        </button>
        </div>
      </div>
      <daffio-terminal-animation
        [script]="script"
        label="A terminal running npx ng add @daffodil/commerce, which installs Daffodil, asks a few setup questions, and generates the files for a new store.">
      </daffio-terminal-animation>
    </div>
  </daff-container>
</daff-callout>
