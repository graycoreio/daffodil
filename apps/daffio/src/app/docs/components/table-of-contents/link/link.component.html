@for (entry of tableOfContents; track entry.slug) {
	<a
		class="daffio-docs-table-of-contents-link daffio-docs-table-of-contents-link__level-{{entry.lvl}}"
		routerLink="./"
		queryParamsHandling="merge"
		[fragment]="entry.slug"
		routerLinkActive
		#rla="routerLinkActive"
		[routerLinkActiveOptions]="ROUTER_LINK_ACTIVE_CONFIG"
		[class.active]="rla.isActive"
	>{{ entry.content }}</a>
}
