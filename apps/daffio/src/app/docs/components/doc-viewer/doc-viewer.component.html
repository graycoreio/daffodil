<daff-container size="lg">
  <div class="daffio-doc-viewer__sidebar-activators">
    <button class="daffio-doc-viewer__button" (click)="open()">
      <fa-icon [icon]="faBars"></fa-icon>
      <div>Menu</div>
    </button>

    @if (toc.length > 0) {
      <button class="daffio-doc-viewer__button" (click)="openToc()">
        <div>On this page</div>
        <fa-icon [icon]="faChevronRight" size="sm"></fa-icon>
      </button>
    }
  </div>
  <div class="daffio-doc-viewer__grid">
    <div class="daffio-doc-viewer__content">
      @if (breadcrumbs.length > 0) {
        <nav aria-label="Breadcrumb">
          <ol daff-breadcrumb>
            @for (breadcrumb of breadcrumbs; track $index) {
              <li daffBreadcrumbItem>
                @if ($last) {
                  {{breadcrumb.label}}
                } @else {
                  <a [routerLink]="breadcrumb.path">{{breadcrumb.label}}</a>
                }
              </li>
            }
          </ol>
        </nav>
      }
      <daff-article>
        <ng-content></ng-content>
      </daff-article>
    </div>
    @if (toc.length > 0) {
      <aside class="daffio-doc-viewer__aside-wrapper">
        <div class="daffio-doc-viewer__aside-title">
          On this page
        </div>
        <daffio-docs-table-of-contents class="daffio-doc-viewer__toc" [tableOfContents]="toc"></daffio-docs-table-of-contents>
        <div class="daffio-doc-viewer__toc-links">
					@if (sourcePath()) {
						<a class="daffio-doc-viewer__edit-button" [attr.href]="editLink()" target="_blank">
							Edit this page on GitHub
							<fa-icon [icon]="faArrowUpRightFromSquare" size="xs"></fa-icon>
						</a>
					}
          <daffio-docs-scroll-to-top class="daffio-doc-viewer__scroll-to-top"></daffio-docs-scroll-to-top>
        </div>
      </aside>
    }
  </div>
</daff-container>
