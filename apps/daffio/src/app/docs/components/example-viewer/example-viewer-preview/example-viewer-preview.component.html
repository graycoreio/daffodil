@if (!simple) {
	<div class="daffio-example-viewer-preview__viewport-wrapper">
		@for (option of viewportOptions; track option.value) {
			<button
				[attr.aria-label]="option.label"
				class="daffio-example-viewer-preview__viewport-option"
				(click)="viewport.set(option.value)"
				[class.selected]="viewport() === option.value">
				<fa-icon [icon]="option.icon"></fa-icon>
			</button>
		}
	</div>
}
<div class="daffio-example-viewer-preview__content" [class]="viewportClass()">
	<ng-container *ngComponentOutlet="exampleComponent()"></ng-container>
</div>
