<daff-media-gallery>
  @for(image of images; track image) {
    <ng-template daffThumbnail [thumbnailSrc]="image.url" [label]="image.label">
      <img daff-image
        alt="{{ image.label }}"
        ngSrc="{{ image.url }}"
        width="594"
        height="737" />
    </ng-template>
  }
</daff-media-gallery>
