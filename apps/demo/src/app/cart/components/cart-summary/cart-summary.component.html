<div class="demo-cart-summary">
  @if (title) {
    <div class="demo-cart-summary__header">
      <span class="demo-cart-summary__title">{{title}}</span>
      <span class="demo-cart-summary__edit-cart"><a (click)="navigateToCart()">Edit Cart</a></span>
    </div>
  }
  <div class="demo-cart-summary__minicart">
    @for (item of cart.items; track item) {
      <demo-minicart-item [item]="item"></demo-minicart-item>
    }
  </div>
</div>
