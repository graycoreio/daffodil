@if ((loading$ | async) === false) {
  <demo-product [product]="product$ | async" [qty]="1" (updateQty)="updateQty($event)">
    <demo-add-to-cart (addToCart)="onAddToCart($event)" [additive]="product$ | async" [qty]="1"></demo-add-to-cart>
  </demo-product>
}
@if ((loading$ | async)) {
  <daff-loading-icon></daff-loading-icon>
}
