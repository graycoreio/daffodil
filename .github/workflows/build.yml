name: Daffodil Build

on:
  push:
    branches:
      - develop
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      cache-mode:
        required: true
        type: string
    secrets:
      VERCEL_DAFFIO_NEXT_PROJECT_ID:
        required: false
      VERCEL_DAFFIO_PROJECT_ID:
        required: false
      VERCEL_TOKEN:
        required: false
      VERCEL_ORG:
        required: false
env:
  NG_BUILD_ENV: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'production' || 'next' }}
  NPM_VERSION: 11
  NX_REMOTE_CACHE_TENANT_ID: ${{ vars.NX_CACHE_TENANT_ID }}
  NX_REMOTE_CACHE_WRITER_CLIENT_ID: ${{ vars.NX_CACHE_WRITER_CLIENT_ID }}
  NX_REMOTE_CACHE_READER_CLIENT_ID: ${{ vars.NX_CACHE_READER_CLIENT_ID }}
  NX_REMOTE_CACHE_ACCESS: ${{ inputs.cache-mode == 'read-only' && 'read' || 'auto' }}
  NX_REMOTE_CACHE: ${{ github.ref_type == 'tag' && 'off' || 'on' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        node: [24.19.x]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref && inputs.ref || github.sha }}
          persist-credentials: false

      - uses: graycoreio/github-actions/setup-node@main
        with:
          node-version: ${{ matrix.node }}
          npm-version: ${{ env.NPM_VERSION }}
          use-stamp-cache: true

      - run: npx nx run-many -t lint
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        node: [24.19.x]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref && inputs.ref || github.sha }}
          persist-credentials: false

      - uses: graycoreio/github-actions/setup-node@main
        with:
          node-version: ${{ matrix.node }}
          npm-version: ${{ env.NPM_VERSION }}
          use-stamp-cache: true

      - run: npx nx run-many -t build --parallel=1

      - run: cd dist/apps/daffio && zip -r ../daffio.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: daffio-${{ matrix.node }}
          path: dist/apps/daffio.zip
          if-no-files-found: error

  compute_packages:
    name: Compute Packages to Test
    outputs:
      packages: ${{ steps.compute.outputs.packages }}
    runs-on: ubuntu-latest
    needs: [ ]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref && inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: graycoreio/github-actions/setup-node@main
        with:
          node-version: '24.19.x'
          npm-version: ${{ env.NPM_VERSION }}
          use-stamp-cache: true
      - uses: nrwl/nx-set-shas@v3
        name: Derive appropriate SHAs for base and head for `nx affected` commands
        with:
          main-branch-name: 'develop'
      - name: packages
        id: compute
        shell: bash
        run: |
          packages=$(npx nx show projects --affected --json)
          echo "packages=$packages" >> ${GITHUB_OUTPUT}
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: ${{ needs.compute_packages.outputs.packages != '[]' && needs.compute_packages.outputs.packages != '' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.compute_packages.outputs.packages) }}
        node: [24.19.x]
    needs:
      - compute_packages
      - build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref && inputs.ref || github.sha }}
          persist-credentials: false

      - uses: graycoreio/github-actions/setup-node@main
        with:
          node-version: ${{ matrix.node }}
          npm-version: ${{ env.NPM_VERSION }}
          use-stamp-cache: true

      - run: npx nx run-many -t test -p ${{ matrix.package }} --parallel=1
        name: Test ${{ matrix.package }}

  test-commerce-schematic:
    name: Test Commerce Schematic
    needs:
      - build
    uses: ./.github/workflows/test-commerce-schematic.yml
    with:
      ref: ${{ inputs.ref && inputs.ref || github.sha }}
      node-versions: '24.19.x'
    permissions:
      contents: read
      id-token: write

  deploy_daffio:
    name: Deploy Daff.io
    needs:
      - build
    uses: ./.github/workflows/deploy.yml
    if: ${{ github.event_name == 'push' }}
    secrets:
      VERCEL_NEXT_PROJECT_ID: ${{ secrets.VERCEL_DAFFIO_NEXT_PROJECT_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DAFFIO_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG: ${{ secrets.VERCEL_ORG }}
    with:
      artifact: daffio-24.19.x
      artifact-zip-name: daffio.zip
