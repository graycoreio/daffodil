name: Daffodil Build

on:
  push:
    branches:
      - develop
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      cache-mode:
        required: true
        type: string
    secrets:
      # Unused since the remote cache moved to GitHub OIDC; still declared so callers that pass
      # them keep validating. Remove both (and stop passing them in build_pull_request.yml) once
      # this version is on develop.
      NX_KEY:
        required: false
      AZURE_STORAGE_CONNECTION_STRING:
        required: false
      VERCEL_DAFFIO_NEXT_PROJECT_ID:
        required: false
      VERCEL_DAFFIO_PROJECT_ID:
        required: false
      VERCEL_TOKEN:
        required: false
      VERCEL_ORG:
        required: false
      # Read access to graycoreio/nx-remote-cache releases (private), for the remote Nx cache.
      NX_CACHE_RELEASE_TOKEN:
        required: false
env:
  NG_BUILD_ENV: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'production' || 'next' }}
  NPM_VERSION: 11

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # remote Nx cache (GitHub OIDC)
    strategy:
      matrix:
        node: [24.19.x]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref && inputs.ref || github.sha }}
          persist-credentials: false

      # Remote Nx cache: starts the cache server inside this job, authenticated with the job's
      # GitHub OIDC token. Skipped for tag/release runs, so release artifacts are always built
      # from scratch (tags also can't match a federated credential).
      - uses: graycoreio/nx-remote-cache-action@test/ts-action
        if: github.ref_type != 'tag'
        with:
          mode: local
          access: ${{ inputs.cache-mode == 'read-only' && 'read' || 'auto' }}
          tenant-id: ${{ vars.NX_CACHE_TENANT_ID }}
          writer-client-id: ${{ vars.NX_CACHE_WRITER_CLIENT_ID }}
          reader-client-id: ${{ vars.NX_CACHE_READER_CLIENT_ID }}
          storage-account: ${{ vars.NX_CACHE_STORAGE_ACCOUNT }}
          storage-container: ${{ vars.NX_CACHE_STORAGE_CONTAINER }}
          github-token: ${{ secrets.NX_CACHE_RELEASE_TOKEN }} # downloads the server release
          server-repo: griest024/nx-remote-cache # fork test: private copy the token can read

      - uses: graycoreio/github-actions/setup-node@main
        with:
          node-version: ${{ matrix.node }}
          npm-version: ${{ env.NPM_VERSION }}
          use-stamp-cache: true

      - run: npx nx run-many -t lint
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # remote Nx cache (GitHub OIDC)
    strategy:
      matrix:
        node: [24.19.x]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref && inputs.ref || github.sha }}
          persist-credentials: false

      - uses: graycoreio/github-actions/setup-node@main
        with:
          node-version: ${{ matrix.node }}
          npm-version: ${{ env.NPM_VERSION }}
          use-stamp-cache: true

      # Remote Nx cache: starts the cache server inside this job, authenticated with the job's
      # GitHub OIDC token. Skipped for tag/release runs, so release artifacts are always built
      # from scratch (tags also can't match a federated credential).
      - uses: graycoreio/nx-remote-cache-action@test/ts-action
        if: github.ref_type != 'tag'
        with:
          mode: local
          access: ${{ inputs.cache-mode == 'read-only' && 'read' || 'auto' }}
          tenant-id: ${{ vars.NX_CACHE_TENANT_ID }}
          writer-client-id: ${{ vars.NX_CACHE_WRITER_CLIENT_ID }}
          reader-client-id: ${{ vars.NX_CACHE_READER_CLIENT_ID }}
          storage-account: ${{ vars.NX_CACHE_STORAGE_ACCOUNT }}
          storage-container: ${{ vars.NX_CACHE_STORAGE_CONTAINER }}
          github-token: ${{ secrets.NX_CACHE_RELEASE_TOKEN }} # downloads the server release
          server-repo: griest024/nx-remote-cache # fork test: private copy the token can read

      - run: npx nx run-many -t build --parallel=1

      - run: cd dist/apps/daffio && zip -r ../daffio.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: daffio-${{ matrix.node }}
          path: dist/apps/daffio.zip
          if-no-files-found: error

  compute_packages:
    name: Compute Packages to Test
    outputs:
      packages: ${{ steps.compute.outputs.packages }}
    runs-on: ubuntu-latest
    needs: [ ]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref && inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: graycoreio/github-actions/setup-node@main
        with:
          node-version: '24.19.x'
          npm-version: ${{ env.NPM_VERSION }}
          use-stamp-cache: true
      - uses: nrwl/nx-set-shas@v3
        name: Derive appropriate SHAs for base and head for `nx affected` commands
        with:
          main-branch-name: 'develop'
      - name: packages
        id: compute
        shell: bash
        run: |
          packages=$(npx nx show projects --affected --json)
          echo "packages=$packages" >> ${GITHUB_OUTPUT}
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # remote Nx cache (GitHub OIDC)
    if: ${{ needs.compute_packages.outputs.packages != '[]' && needs.compute_packages.outputs.packages != '' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.compute_packages.outputs.packages) }}
        node: [24.19.x]
    needs:
      - compute_packages
      - build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref && inputs.ref || github.sha }}
          persist-credentials: false

      # Remote Nx cache: starts the cache server inside this job, authenticated with the job's
      # GitHub OIDC token. Skipped for tag/release runs, so release artifacts are always built
      # from scratch (tags also can't match a federated credential).
      - uses: graycoreio/nx-remote-cache-action@test/ts-action
        if: github.ref_type != 'tag'
        with:
          mode: local
          access: ${{ inputs.cache-mode == 'read-only' && 'read' || 'auto' }}
          tenant-id: ${{ vars.NX_CACHE_TENANT_ID }}
          writer-client-id: ${{ vars.NX_CACHE_WRITER_CLIENT_ID }}
          reader-client-id: ${{ vars.NX_CACHE_READER_CLIENT_ID }}
          storage-account: ${{ vars.NX_CACHE_STORAGE_ACCOUNT }}
          storage-container: ${{ vars.NX_CACHE_STORAGE_CONTAINER }}
          github-token: ${{ secrets.NX_CACHE_RELEASE_TOKEN }} # downloads the server release
          server-repo: griest024/nx-remote-cache # fork test: private copy the token can read

      - uses: graycoreio/github-actions/setup-node@main
        with:
          node-version: ${{ matrix.node }}
          npm-version: ${{ env.NPM_VERSION }}
          use-stamp-cache: true

      - run: npx nx run-many -t test -p ${{ matrix.package }} --parallel=1
        name: Test ${{ matrix.package }}

  test-commerce-schematic:
    name: Test Commerce Schematic
    needs:
      - build
    uses: ./.github/workflows/test-commerce-schematic.yml
    with:
      ref: ${{ inputs.ref && inputs.ref || github.sha }}
      node-versions: '24.19.x'
    secrets:
      NX_CACHE_RELEASE_TOKEN: ${{ secrets.NX_CACHE_RELEASE_TOKEN }}
    permissions:
      contents: read
      id-token: write # remote Nx cache (GitHub OIDC)

  deploy_daffio:
    name: Deploy Daff.io
    needs:
      - build
    uses: ./.github/workflows/deploy.yml
    if: ${{ github.event_name == 'push' && github.repository == 'graycoreio/daffodil' }} # fork test: no Vercel secrets
    secrets:
      VERCEL_NEXT_PROJECT_ID: ${{ secrets.VERCEL_DAFFIO_NEXT_PROJECT_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DAFFIO_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG: ${{ secrets.VERCEL_ORG }}
    with:
      artifact: daffio-24.19.x
      artifact-zip-name: daffio.zip
