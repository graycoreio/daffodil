name: Daffodil Build Release

on:
  push:
    tags:
      - 'v*'

# build.yml's jobs request id-token (for the remote cache); a caller must grant at least what its
# called jobs request, even though release runs skip the cache.
permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build Release
    uses: ./.github/workflows/build.yml
    with:
      cache-mode: 'read-only'
      ref: ${{ github.sha }}
    secrets:
      VERCEL_DAFFIO_NEXT_PROJECT_ID: ${{ secrets.VERCEL_DAFFIO_NEXT_PROJECT_ID }}
      VERCEL_DAFFIO_PROJECT_ID: ${{ secrets.VERCEL_DAFFIO_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG: ${{ secrets.VERCEL_ORG }}