name: Daffodil Build Release

on:
  push:
    tags:
      - 'v*'

# We need this here because build.yml's jobs request `id-token: write` for the remote Nx cache, and
# GitHub fails a reusable workflow call when the caller grants less than the called jobs request.
# Release runs don't actually use the cache (it's off for tags).
permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build Release
    uses: ./.github/workflows/build.yml
    with:
      cache-mode: 'read-only'
      ref: ${{ github.sha }}
    secrets:
      VERCEL_DAFFIO_NEXT_PROJECT_ID: ${{ secrets.VERCEL_DAFFIO_NEXT_PROJECT_ID }}
      VERCEL_DAFFIO_PROJECT_ID: ${{ secrets.VERCEL_DAFFIO_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG: ${{ secrets.VERCEL_ORG }}