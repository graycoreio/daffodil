name: Create Release

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      release-mode:
        description: 'auto = follow conventional commits; rc = bump the rc suffix; graduate = graduate the current rc to a stable release.'
        type: choice
        required: false
        default: auto
        options:
          - auto
          - rc
          - graduate

env:
  NPM_VERSION: 11

jobs:
  release-please:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.21.x]
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GRAYCORE_GITHUB_TOKEN }}
          config-file: ${{ inputs.release-mode == 'rc' && 'release-please-config.rc.json' || (inputs.release-mode == 'graduate' && 'release-please-config.graduate.json' || 'release-please-config.json') }}
          target-branch: develop

      - uses: actions/checkout@v6
        with:
          ref: release-please--branches--develop--components--daffodil
          token: ${{ secrets.GRAYCORE_GITHUB_TOKEN }}

      - uses: graycoreio/github-actions/setup-node@main
        with:
          node-version: ${{ matrix.node }}
          npm-version: ${{ env.NPM_VERSION }}
          use-stamp-cache: true

      - name: Add Packages to README
        run: |
          git config user.name "GrayBot"
          git config user.email "automation@graycore.io"
          cd tools/release
          npx gulp addPackagesToReadme
          git add ../../README.md
          git commit -m 'docs: autogenerate package table in README' || true
          npx gulp annotateDeprecationMessages
          git add ../..
          git commit -m 'docs: annotate deprecation messages' || true
          git push
