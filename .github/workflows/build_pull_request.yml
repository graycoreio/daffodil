name: Daffodil Build PR

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  id-token: write # remote Nx cache (GitHub OIDC); fork PRs get no token and build without it

jobs:
  build:
    name: Build PR
    uses: graycoreio/daffodil/.github/workflows/build.yml@develop
    with:
      cache-mode: 'read-only'
      ref: ${{ github.event.pull_request.head.sha }}
    # NX_KEY / AZURE_STORAGE_CONNECTION_STRING: no longer used. Still passed only because this PR
    # runs build.yml from develop, which requires them until the new version is merged; remove
    # these two lines (and the declarations in build.yml) afterwards.
    secrets:
      NX_CACHE_RELEASE_TOKEN: ${{ secrets.NX_CACHE_RELEASE_TOKEN }}
      NX_KEY: ${{ secrets.NX_KEY }}
      AZURE_STORAGE_CONNECTION_STRING: ${{ github.event.pull_request.head.repo.full_name == github.repository && secrets.AZURE_NX_CACHE_READWRITE_CONNECTION_STRING || secrets.AZURE_NX_CACHE_READONLY_CONNECTION_STRING }}

  build-success:
    name: Build PR Success
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    steps:
      - name: Check build result
        run: |
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "Build did not succeed (result: ${{ needs.build.result }})"
            exit 1
          fi


