name: Daffodil Lint

on:
  push:
    paths:
      - '**.ts'
      - '**.scss'
      - '**.html'
      - '**.js'
      - '**.json'
      - '.github/**'
    branches:
      - develop
    tags: ["v*"]
  pull_request:
    paths:
      - '**.ts'
      - '**.scss'
      - '**.html'
      - '**.js'
      - '**.json'
      - '.github/**'
    branches:
      - develop
  pull_request_target:
    paths:
      - '**.ts'
      - '**.scss'
      - '**.html'
      - '**.js'
      - '**.json'
      - '!.github/**'
    branches:
      - develop

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20.18.x]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: graycoreio/github-actions/setup-node@main
        with:
          node-version: ${{ matrix.node }}
          use-stamp-cache: true

      - run: AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_NX_CACHE_CONNECTION_STRING }} NX_KEY=${{ secrets.NX_KEY }} npx nx run-many --target=lint
