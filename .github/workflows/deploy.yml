on:
  workflow_call:
    inputs:
      artifact:
        required: true
        description: 'The name of the artifact to download'
        type: string
      artifact-zip-name:
          required: false
          description: 'The name of the zip file in the artifact (omit if you do not store a zip INSIDE your artifact).'
          type: string
      static-routes:
        required: false
        description: 'A JSON array of Vercel Build Output API routes (e.g. redirects) checked before the static files.'
        type: string
        default: '[]'
      static-not-found-page:
        required: false
        description: 'The page, relative to the browser output, served with a 404 status for unmatched routes.'
        type: string
        default: 'index.csr.html'
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG:
        required: true
      VERCEL_NEXT_PROJECT_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true
jobs:
  next:
    name: 'Next'
    runs-on: ubuntu-latest
    environment:
      name: next
      url: ${{ steps.vercel-deploy.outputs.url }}
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}

      - run: unzip -q ${{ inputs.artifact-zip-name }} -d . && rm ${{ inputs.artifact-zip-name }}
        name: Unzip internal artifact zip
        if: inputs.artifact-zip-name

      - uses: graycoreio/github-actions/angular-universal-vercel@v3.0.0
        id: vercel-deploy
        with:
          prod: true
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_org: ${{ secrets.VERCEL_ORG }}
          vercel_project_id: ${{ secrets.VERCEL_NEXT_PROJECT_ID }}
          ng_output_mode: 'static'
          static_routes: ${{ inputs.static-routes }}
          static_not_found_page: ${{ inputs.static-not-found-page }}

  production:
    name: 'Production'
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: ${{ steps.vercel-deploy.outputs.url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}

      - run: unzip -q ${{ inputs.artifact-zip-name }} -d . && rm ${{ inputs.artifact-zip-name }}
        name: Unzip internal artifact zip
        if: inputs.artifact-zip-name

      - uses: graycoreio/github-actions/angular-universal-vercel@v3.0.0
        id: vercel-deploy
        with:
          prod: true
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_org: ${{ secrets.VERCEL_ORG }}
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}
          ng_output_mode: 'static'
          static_routes: ${{ inputs.static-routes }}
          static_not_found_page: ${{ inputs.static-not-found-page }}