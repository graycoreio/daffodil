name: Upload Search Index

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: 0 4 * * *

env:
  NPM_VERSION: 11
  # Remote Nx cache: the @graycore/nx-remote-cache plugin (nx.json) starts the cache server
  # whenever Nx runs tasks, authenticated with the job's GitHub OIDC token. It only takes the CI
  # identities from here. Jobs without an OIDC token (fork PRs) build without the cache.
  NX_REMOTE_CACHE_TENANT_ID: ${{ vars.NX_CACHE_TENANT_ID }}
  NX_REMOTE_CACHE_READER_CLIENT_ID: ${{ vars.NX_CACHE_READER_CLIENT_ID }}
  NX_REMOTE_CACHE_ACCESS: read
  # Release (tag) runs always build from scratch; tags also can't match a federated credential.
  NX_REMOTE_CACHE: ${{ github.ref_type == 'tag' && 'off' || 'on' }}

jobs:
  algolia:
    name: Upload Algolia Index
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'push' && github.event.ref || github.sha }}
          persist-credentials: false

      - uses: graycoreio/github-actions/setup-node@main
        with:
          node-version: 24.19.x
          npm-version: ${{ env.NPM_VERSION }}
          use-stamp-cache: true

      - run: npx nx run tools-dgeni:build

      - uses: graycoreio/github-actions/upload-algolia-index@main
        with:
          appId: ${{ secrets.ALGOLIA_APP_ID }}
          apiKey: ${{ secrets.ALGOLIA_API_KEY }}
          indexName: ${{ github.event_name == 'push' && vars.ALGOLIA_PROD_INDEX || vars.ALGOLIA_NEXT_INDEX }}
          dir: ${{ github.workspace }}/dist/docs-assets/docs
          glob: '**/search-index/**/*'
