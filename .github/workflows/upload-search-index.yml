name: Upload Search Index

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: 0 4 * * *

env:
  NPM_VERSION: 11

jobs:
  algolia:
    name: Upload Algolia Index
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # remote Nx cache (GitHub OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'push' && github.event.ref || github.sha }}
          persist-credentials: false

      # Remote Nx cache: starts the cache server inside this job, authenticated with the job's
      # GitHub OIDC token. Skipped for tag/release runs, so release artifacts are always built
      # from scratch (tags also can't match a federated credential).
      - uses: graycoreio/github-actions/nx-remote-cache@feat/nx-remote-cache
        if: github.ref_type != 'tag'
        with:
          mode: local
          access: read
          tenant-id: ${{ vars.NX_CACHE_TENANT_ID }}
          writer-client-id: ${{ vars.NX_CACHE_WRITER_CLIENT_ID }}
          reader-client-id: ${{ vars.NX_CACHE_READER_CLIENT_ID }}
          storage-account: ${{ vars.NX_CACHE_STORAGE_ACCOUNT }}
          storage-container: ${{ vars.NX_CACHE_STORAGE_CONTAINER }}

      - uses: graycoreio/github-actions/setup-node@main
        with:
          node-version: 24.19.x
          npm-version: ${{ env.NPM_VERSION }}
          use-stamp-cache: true

      - run: npx nx run tools-dgeni:build

      - uses: graycoreio/github-actions/upload-algolia-index@main
        with:
          appId: ${{ secrets.ALGOLIA_APP_ID }}
          apiKey: ${{ secrets.ALGOLIA_API_KEY }}
          indexName: ${{ github.event_name == 'push' && vars.ALGOLIA_PROD_INDEX || vars.ALGOLIA_NEXT_INDEX }}
          dir: ${{ github.workspace }}/dist/docs-assets/docs
          glob: '**/search-index/**/*'
