name: Daffodil Build Schematic

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'tools/schematics/**'

env:
  WORK_DIR: /tmp/daffodil-commerce-test
  VERDACCIO_STORAGE: /tmp/verdaccio-storage
  TEST_VERSION: 0.0.0-test.${{ github.run_id }}
  REGISTRY_PORT: 4873
  DAFFODIL_PACKAGES: >-
    core
    driver
    product
    dev-tools
    navigation
    external-router

jobs:
  setup:
    name: Build
    runs-on: ubuntu-latest
    services:
      verdaccio:
        image: verdaccio/verdaccio
        ports:
          - 4873:4873
        volumes:
          - /tmp/verdaccio-storage:/verdaccio/storage
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: graycoreio/github-actions/setup-node@main
        with:
          node-version: 22.21.x
          use-stamp-cache: true

      - name: Configure Verdaccio
        run: |
          REGISTRY_URL="http://localhost:${{ env.REGISTRY_PORT }}"
          VERDACCIO_CONTAINER=$(docker ps --filter "ancestor=verdaccio/verdaccio" --format "{{.ID}}")
          npx wait-on ${REGISTRY_URL}/-/ping --timeout 30000
          docker exec --user root ${VERDACCIO_CONTAINER} sh -c 'mkdir -p /verdaccio/storage/data && touch /verdaccio/storage/htpasswd && chmod -R 777 /verdaccio/storage'
          RESPONSE=$(curl -s -X PUT ${REGISTRY_URL}/-/user/org.couchdb.user:ci \
            -H "Content-Type: application/json" \
            -d '{"name":"ci","password":"ci-password","type":"user"}')
          TOKEN=$(echo "$RESPONSE" | node -e "process.stdin.resume();process.stdin.on('data',d=>console.log(JSON.parse(d).token))")
          if [ -z "$TOKEN" ]; then echo "ERROR: Failed to obtain Verdaccio token. Response: $RESPONSE" && exit 1; fi
          echo "@daffodil:registry=${REGISTRY_URL}" >> "$HOME/.npmrc"
          echo "//localhost:${{ env.REGISTRY_PORT }}/:_authToken=${TOKEN}" >> "$HOME/.npmrc"

      - name: Set test version
        run: |
          npm version "${{ env.TEST_VERSION }}" --no-git-tag-version
          sed -i "s/version = '.*'/version = '${{ env.TEST_VERSION }}'/" \
            tools/schematics/ng-add/generators/version.ts

      - name: Build @daffodil/* packages
        run: |
          npx nx run-many -t build \
            --projects=@daffodil/core,@daffodil/driver,@daffodil/product,@daffodil/dev-tools,@daffodil/navigation,@daffodil/external-router
          cd tools/schematics && npm run build

      - uses: graycoreio/github-actions/set-versions-from-root@main

      - name: Publish @daffodil/* packages to Verdaccio
        run: |
          for pkg in ${{ env.DAFFODIL_PACKAGES }}; do
            echo "--- Publishing @daffodil/$pkg ---"
            cd "${{ github.workspace }}/dist/$pkg"
            npm publish --ignore-scripts
          done

          echo "--- Publishing @daffodil/commerce ---"
          cd "${{ github.workspace }}/dist/commerce"
          npm publish --ignore-scripts

      - name: Scaffold base apps
        run: bash tools/schematics/e2e/test-commerce-schematics.sh

      - name: Cache base apps and Verdaccio storage
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.WORK_DIR }}
            ${{ env.VERDACCIO_STORAGE }}/data
          key: commerce-test-${{ github.run_id }}

  test:
    name: "${{ matrix.name }}"
    needs: setup
    runs-on: ubuntu-latest
    services:
      verdaccio:
        image: verdaccio/verdaccio
        ports:
          - 4873:4873
        volumes:
          - /tmp/verdaccio-storage:/verdaccio/storage
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: demo-driver
            driver: demo
            base: scss
            app_type: standalone
            routing: true
            skip_package_json: false
            succeed: true
            build: true

          - name: magento-driver
            driver: magento
            base: scss
            app_type: standalone
            routing: true
            skip_package_json: false
            succeed: true
            build: true

          - name: shopify-driver
            driver: shopify
            base: scss
            app_type: standalone
            routing: true
            skip_package_json: false
            succeed: true
            build: true

          - name: in-memory-driver
            driver: in-memory
            base: scss
            app_type: standalone
            routing: true
            skip_package_json: false
            succeed: true
            build: true

          - name: skip-package-json
            driver: in-memory
            base: scss
            app_type: standalone
            routing: true
            skip_package_json: true
            succeed: true
            build: false

          - name: module-app-rejection
            driver: in-memory
            base: scss
            app_type: module
            routing: true
            skip_package_json: false
            succeed: false
            build: false

          - name: main-ts-fallback
            driver: in-memory
            base: scss
            app_type: main-ts-fallback
            routing: true
            skip_package_json: false
            succeed: true
            build: true

          - name: css-style-failure
            driver: in-memory
            base: css
            app_type: standalone
            routing: true
            skip_package_json: false
            succeed: false
            build: true

          - name: no-app-routes
            driver: in-memory
            base: scss
            app_type: standalone
            routing: false
            skip_package_json: false
            succeed: true
            build: true

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: graycoreio/github-actions/setup-node@main
        with:
          node-version: 22.21.x

      - name: Prepare Verdaccio storage for cache restore
        run: |
          VERDACCIO_CONTAINER=$(docker ps --filter "ancestor=verdaccio/verdaccio" --format "{{.ID}}")
          npx wait-on http://localhost:${{ env.REGISTRY_PORT }}/-/ping --timeout 30000
          docker exec --user root ${VERDACCIO_CONTAINER} sh -c 'mkdir -p /verdaccio/storage/data && touch /verdaccio/storage/htpasswd && chmod -R 777 /verdaccio/storage'
          sudo chown -R $USER ${{ env.VERDACCIO_STORAGE }}/data

      - name: Restore base apps and Verdaccio storage
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.WORK_DIR }}
            ${{ env.VERDACCIO_STORAGE }}/data
          key: commerce-test-${{ github.run_id }}

      - name: Configure npmrc
        run: |
          REGISTRY_URL="http://localhost:${{ env.REGISTRY_PORT }}"
          RESPONSE=$(curl -s -X PUT ${REGISTRY_URL}/-/user/org.couchdb.user:ci \
            -H "Content-Type: application/json" \
            -d '{"name":"ci","password":"ci-password","type":"user"}')
          echo "Verdaccio auth response: $RESPONSE"
          TOKEN=$(echo "$RESPONSE" | node -e "process.stdin.resume();process.stdin.on('data',d=>console.log(JSON.parse(d).token))")
          if [ -z "$TOKEN" ]; then echo "ERROR: Failed to obtain Verdaccio token" && exit 1; fi
          echo "@daffodil:registry=${REGISTRY_URL}" >> "$HOME/.npmrc"
          echo "//localhost:${{ env.REGISTRY_PORT }}/:_authToken=${TOKEN}" >> "$HOME/.npmrc"

      - name: Copy base app
        run: |
          BASE_APP="${{ env.WORK_DIR }}/test-daff-app"
          if [ "${{ matrix.base }}" = "css" ]; then
            BASE_APP="${{ env.WORK_DIR }}/test-daff-app-css"
          fi
          TEST_DIR="${{ env.WORK_DIR }}/test-${{ matrix.name }}"
          rm -rf "$TEST_DIR"
          cp -a "$BASE_APP" "$TEST_DIR"

      - name: Apply app modifications
        working-directory: ${{ env.WORK_DIR }}/test-${{ matrix.name }}
        run: |
          if [ "${{ matrix.app_type }}" = "module" ]; then
          cat > "src/app/app-module.ts" <<'APPMOD'
          import { NgModule } from '@angular/core';
          import { BrowserModule } from '@angular/platform-browser';
          import { AppComponent } from './app.component';

          @NgModule({
            declarations: [AppComponent],
            imports: [BrowserModule],
            bootstrap: [AppComponent]
          })
          export class AppModule {}
          APPMOD
          fi

          if [ "${{ matrix.app_type }}" = "main-ts-fallback" ]; then
          cat > "src/main.ts" <<'MAIN'
          import { bootstrapApplication } from '@angular/platform-browser';
          import { App } from './app/app';

          bootstrapApplication(App, {
            providers: []
          });
          MAIN
          rm -f "src/app/app.config.ts"
          fi

          if [ "${{ matrix.routing }}" = "false" ]; then
          rm -f "src/app/app.routes.ts"
          fi

      - name: Generate schematic
        working-directory: ${{ env.WORK_DIR }}/test-${{ matrix.name }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ matrix.skip_package_json }}" = "true" ]; then
            EXTRA_FLAGS="--skip-package-json"
          fi

          if [ "${{ matrix.succeed }}" = "true" ] || [ "${{ matrix.build }}" = "true" ]; then
          # @daffodil/commerce package installed when scaffolding base apps
            CI=true npx ng generate @daffodil/commerce:ng-add \
              --driver="${{ matrix.driver }}" \
              --is-new-project \
              --defaults \
              $EXTRA_FLAGS
          else
            ! CI=true npx ng generate @daffodil/commerce:ng-add \
              --driver="${{ matrix.driver }}" \
              --is-new-project \
              --defaults \
              $EXTRA_FLAGS
          fi

      - name: Raise budget
        if: matrix.driver == 'demo'
        working-directory: ${{ env.WORK_DIR }}/test-${{ matrix.name }}
        run: |
          sed -i 's/"maximumWarning": "[^"]*"/"maximumWarning": "2mb"/; s/"maximumError": "[^"]*"/"maximumError": "3mb"/' angular.json

      - name: Run ng build
        if: matrix.build
        working-directory: ${{ env.WORK_DIR }}/test-${{ matrix.name }}
        run: |
          if [ "${{ matrix.succeed }}" = "true" ]; then
            npx ng build
          else
            ! npx ng build
          fi